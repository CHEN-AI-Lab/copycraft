name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx vitest run
      - run: pnpm --filter web build
      # Vercel auto-deploys on push — this workflow verifies quality before deploy
      - run: echo "✅ Quality checks passed. Push triggers Vercel auto-deploy."